# Reference Docs ::
# https://docs.datahub.com/docs/generated/ingestion/sources/bigquery
pipeline_name: "datahub-bigquery-ingest"

datahub_api:
  server: "${DATAHUB_REST_SERVER}"

source:
  type: bigquery
  config:
    # Stateful ingestion for detecting deleted tables
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true
      fail_safe_threshold: 95

    dataset_pattern:
      allow:
        - "hackernews_rss_raw"    # Raw data from Airbyte
        - "stg_hackernews_rss"    # Staging views
        - "hackernews_rss"        # Core/analytics tables

    include_tables: true
    include_views: true
    include_table_lineage: true

    profiling:
      enabled: false  # disabled by default as it can be resource intensive

sink:
  type: "datahub-kafka"
  config:
    connection:
      bootstrap: "${DATAHUB_KAFKA_BOOSTRAP_SERVERS}"
      schema_registry_url: "${DATAHUB_SCHEMA_REGISTRY_URL}"

  # Alternatively, you can use DataHub REST Server
  # type: datahub-rest
  # config:
  #   server: "${DATAHUB_REST_SERVER}"
