# Reference Docs ::
# https://docs.datahub.com/docs/generated/ingestion/sources/metabase
pipeline_name: "datahub-metabase-ingest"

datahub_api:
  server: "${DATAHUB_REST_SERVER}"

source:
  type: metabase
  config:
    # Stateful ingestion for detecting deleted dashboards/charts
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true
      fail_safe_threshold: 95

    connect_uri: "${METABASE_URL}"
    api_key: "${METABASE_API_KEY}"

    exclude_other_user_collections: false

sink:
  type: "datahub-kafka"
  config:
    connection:
      bootstrap: "${DATAHUB_KAFKA_BOOSTRAP_SERVERS}"
      schema_registry_url: "${DATAHUB_SCHEMA_REGISTRY_URL}"

  # Alternatively, you can use DataHub REST Server
  # type: datahub-rest
  # config:
  #   server: "${DATAHUB_REST_SERVER}"
