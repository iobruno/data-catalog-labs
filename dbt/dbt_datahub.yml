# Reference Docs ::
# https://docs.datahub.com/docs/generated/ingestion/sources/dbt#module-dbt
pipeline_name: "datahub-dbt-bigquery-ingest"

datahub_api:
  server: "${DATAHUB_REST_SERVER}"

source:
  type: dbt

  config:
    # Stateful ingestion for detecting deleted entities
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true
      fail_safe_threshold: 95

    target_platform: "bigquery"

    manifest_path: "./target/manifest.json"
    catalog_path: "./target/catalog.json"
    run_results_paths:
      - "./target/run_results.json"

    include_column_lineage: true
    enable_meta_mapping: true
    write_semantics: "OVERRIDE"

    entities_enabled:
      models: "YES"
      model_performance: "YES"

      sources: "YES"
      seeds: "YES"
      snapshots: "YES"

      test_definitions: "YES"
      test_results: "YES"

    git_info:
      repo: "https://github.com/iobruno/data-catalog-labs"
      branch: "master"
      url_subdir: "dbt/"

sink:
  type: "datahub-kafka"
  config:
    connection:
      bootstrap: "${DATAHUB_KAFKA_BOOSTRAP_SERVERS}"
      schema_registry_url: "${DATAHUB_SCHEMA_REGISTRY_URL}"

  # Alternatively, you can use DataHub REST Server
  # type: datahub-rest
  # config:
  #   server: "${DATAHUB_REST_SERVER}"
