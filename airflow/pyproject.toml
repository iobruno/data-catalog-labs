[project]
name = "airflow-data-catalog"
version = "1.0"
description = "Workflow orchestration with Airflow"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "apache-airflow==2.11.1",                               # pin to 2.11 for parity with GCP Composer/AWS MWAA
    "sqlalchemy>=1.4,<2.0",                                 # Airflow doesn't yet support SQLAlchemy 2.x
    "psycopg2-binary>=2.9,<3.0",                            # psycopg3 is only supported by SQLAlchemy 2.0+

    "apache-airflow-providers-airbyte>=5.5,<5.6",           # Airbyte operator
    "apache-airflow-providers-docker>=4.5,<4.6",            # Docker operator for running containers (dbt-core)
    "apache-airflow-providers-google>=22.2,<22.3",          # SFTPToGCSOperator + GCS hooks
    "apache-airflow-providers-sftp>=5.8,<5.9",              # SFTP hook (required by SFTPToGCSOperator)
    "acryl-datahub-airflow-plugin[airflow2]>=1.5,<=1.6.0",  # DataHub plugin for Airflow (<=1.6.0 is last one to support Airflow 2.x)
]

[project.optional-dependencies]
celery = [
    "apache-airflow-providers-celery>=3.22,<3.23",          # required for CeleryExecutor
    "apache-airflow-providers-redis>=4.5,<4.6",             # required for CeleryExecutor
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "jupyterlab>=4.6",
]

[tool.setuptools.packages.find]
exclude = ["config", "dags", "logs", "plugins"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = false
preview = true  # unstable: enables 'hug_parens_with_braces_and_square_brackets' for compact StructType([...])

[tool.ruff.lint]
preview = true  # unstable: enables latest lint rules before stabilization
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax for newer Python)
    "B",    # flake8-bugbear (common bug patterns)
    "SIM",  # flake8-simplify (code simplification)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "RUF013",  # implicit Optional
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # allow imports not at top in notebooks
